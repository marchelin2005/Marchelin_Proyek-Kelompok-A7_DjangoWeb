<!DOCTYPE html>
<html>
<head>
    <title>Django Blog</title>
</head>
<body>

<h1>
    <a href="/">Django Blog 7</a>
</h1>

{% for post in posts %}
    <article>
        <h2>
            <a href="#">{{ post.title }}</a>
        </h2>

        <p>{{ post.text }}</p>

        {% if post.published_date %}
            <p>
                <small>
                    published: {{ post.published_date }}
                </small>
            </p>
        {% endif %}
    </article>
{% endfor %}

</body>
</html>
